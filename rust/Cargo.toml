[package]
name = "emcfile_fast"
version = "0.2.0"
edition = "2021"

[lib]
name = "emcfile_fast"
crate-type = ["cdylib"]

[dependencies]
# Py_buffer is part of the stable ABI starting with Python 3.11.
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }
numpy = "0.30.0"
rayon = "1.12.0"
zstd-safe = { version = "8.2.0", default-features = false }

[features]
extension-module = ["pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
