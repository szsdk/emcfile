[package]
name = "emcfile_parquet_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "_parquet_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py311"] }
numpy = "0.30.0"
rayon = "1.12.0"
zstd-safe = { version = "8.2.0", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
