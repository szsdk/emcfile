[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "emcfile-fast"
version = "0.2.0"
description = "Rust SIMD+Zstd acceleration for emcfile (HDF5 and Parquet)"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.20",
]

[project.urls]
Repository = "https://github.com/szsdk/emcfile"

[tool.maturin]
module-name = "emcfile_fast"
bindings = "pyo3"
features = ["extension-module"]
