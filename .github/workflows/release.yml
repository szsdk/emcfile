name: Release wheels

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: emcfile-fast / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: runner.os != 'Linux'
        with:
          python-version: "3.11"
      - name: Build stable ABI wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: >-
            --manifest-path rust/Cargo.toml --release --locked --out dist
            --interpreter ${{ runner.os == 'Linux' && 'python3.11' || 'python' }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Audit wheel and test the Buffer API
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [[ ${#wheels[@]} -ne 1 || ${wheels[0]} != *-cp311-abi3-*.whl ]]; then
            echo "Expected one cp311-abi3 wheel, found: ${wheels[*]}" >&2
            exit 1
          fi
          wheel=${wheels[0]}
          python -m pip install abi3audit==0.0.26 "$wheel"
          python -m abi3audit --strict --summary "$wheel"
          python - <<'PY'
          from struct import pack

          from emcfile_fast import emc

          data = bytes(1024) + pack('<II', 2, 3)
          for payload in (data, bytearray(data)):
              with memoryview(payload) as view:
                  arrays = emc.emc_read_counts_and_offsets(view, 1)
                  assert [array.tolist() for array in arrays] == [[2], [3], [0, 2], [0, 3]]
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emcfile-fast-${{ matrix.target }}
          path: dist/*-cp311-abi3-*.whl
          if-no-files-found: error
          overwrite: true

  attach:
    name: Attach wheels to the GitHub release
    if: github.event_name == 'release'
    needs: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: emcfile-fast-*
          path: wheels
          merge-multiple: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload --repo "$GITHUB_REPOSITORY" --clobber -- "$RELEASE_TAG" wheels/*.whl
