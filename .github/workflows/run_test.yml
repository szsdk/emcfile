name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  lint:
    name: Ruff, Mypy & Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.23"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install dependencies
        run: uv sync --group dev
      - name: Lint with Ruff
        run: uv run --no-sync ruff check .
      - name: Type-check with Mypy
        run: uv run --no-sync mypy src
      - name: Check & test Rust crate
        run: |
          PY_BIN="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          PY_LIBDIR="$(uv run --no-sync python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR") or "")')"
          export PYO3_PYTHON="$PY_BIN"
          export LD_LIBRARY_PATH="${PY_LIBDIR}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path rust/Cargo.toml

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }} / ${{ matrix.dependencies }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        dependencies: [core, fast]
        include:
          - os: macos-latest
            python-version: "3.13"
            dependencies: fast
          - os: windows-latest
            python-version: "3.13"
            dependencies: fast

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.23"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            rust/pyproject.toml
            rust/Cargo.toml
            rust/Cargo.lock
          cache-suffix: ${{ matrix.dependencies }}
      - name: Install core dependencies
        if: matrix.dependencies == 'core'
        run: uv sync --group dev
      - name: Install optional fast dependencies
        if: matrix.dependencies == 'fast'
        run: uv sync --group dev --extra fast
      - name: Verify dependency profile
        env:
          DEPENDENCY_PROFILE: ${{ matrix.dependencies }}
        run: >-
          uv run --no-sync python -c
          "import importlib.util, os;
          expected = os.environ['DEPENDENCY_PROFILE'] == 'fast';
          bad = [m for m in ('emcfile_fast', 'hdf5plugin') if (importlib.util.find_spec(m) is not None) != expected];
          assert not bad, bad"
      - name: Test with pytest
        run: >-
          uv run --no-sync pytest tests tutorial/test_tutorial.py
          --cov=emcfile --cov-report=term-missing --cov-report=xml
          --junitxml=junit.xml
      - name: Upload test reports
        if: ${{ !cancelled() && hashFiles('junit.xml') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.dependencies }}
          path: |
            junit.xml
            coverage.xml
          retention-days: 14
          if-no-files-found: error
